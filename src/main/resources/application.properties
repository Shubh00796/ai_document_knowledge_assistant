spring.application.name=ai-document-knowledge-assistant

server.port=8098

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/blogapplication?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Shubham@007

app.rag.retrieval.min-similarity=0.55

## Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Chunking
app.chunking.chunk-size=1000
app.chunking.overlap=200

# Ollama
app.embedding.ollama.base-url=http://localhost:11434
app.embedding.ollama.model=nomic-embed-text
app.ollama.chat-model=llama3.2:3b

# RAG
app.rag.retrieval.top-k=5
app.rag.retrieval.neighbor-radius=1
app.rag.context.max-chunks=8
app.rag.context.max-characters=5000

# HikariCP (connection pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

